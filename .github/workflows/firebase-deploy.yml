# Deploys Firebase Hosting and Realtime Database rules.
# Works on GitHub Free, including private repositories (Actions minutes included).
#
# One-time setup (Kevin):
#   1. Firebase console → Project settings → Service accounts →
#      Generate new private key. That downloads a JSON file.
#   2. The account needs permission to deploy Hosting and Realtime Database rules
#      (the default "Firebase Admin SDK" service account already can).
#   3. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret.
#      Name: FIREBASE_SERVICE_ACCOUNT
#      Value: paste the entire JSON file.
#   4. Push to main, or run this workflow by hand (Actions → Deploy to Firebase → Run).
#
# The secret never appears in the repository.

name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write the service account into a temp file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT. See the top of this workflow file."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy hosting and database rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: firebase deploy --only hosting,database --project paket-production-dashboard-v1 --non-interactive
